name: Build

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CEF_VERSION: "cef_binary_117.2.5%2Bgda4c36a%2Bchromium-117.0.5938.152"
  CEF_CACHE_VERSION: "117.2.5-gda4c36a-chromium-117.0.5938.152"
  XPLANE_SDK_URL: "https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK420.zip"
  XPLANE_SDK_VERSION: "420"

jobs:
  # ---------------------------------------------------------------------------
  # macOS – arm64 (Apple Silicon), signed & notarized
  # ---------------------------------------------------------------------------
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Dependencies ----
      - name: Cache CEF (macOS arm64)
        id: cache-cef-mac
        uses: actions/cache@v4
        with:
          path: lib/mac_x64/cef
          key: cef-macosarm64-${{ env.CEF_CACHE_VERSION }}

      - name: Download CEF (macOS arm64)
        if: steps.cache-cef-mac.outputs.cache-hit != 'true'
        run: |
          curl -fSL -o cef_mac.tar.bz2 \
            "https://cef-builds.spotifycdn.com/${CEF_VERSION}_macosarm64.tar.bz2"
          mkdir -p cef_mac_extract
          tar xjf cef_mac.tar.bz2 -C cef_mac_extract --strip-components=1
          mkdir -p lib/mac_x64/cef
          cp -R cef_mac_extract/include lib/mac_x64/cef/
          cp -R cef_mac_extract/Release lib/mac_x64/cef/
          cp -R cef_mac_extract/libcef_dll lib/mac_x64/cef/
          cp -R cef_mac_extract/cmake lib/mac_x64/cef/
          cp cef_mac_extract/CMakeLists.txt lib/mac_x64/cef/
          cp cef_mac_extract/LICENSE.txt lib/mac_x64/cef/
          cp cef_mac_extract/README.txt lib/mac_x64/cef/

      - name: Build CEF wrapper (macOS)
        if: steps.cache-cef-mac.outputs.cache-hit != 'true'
        run: |
          cd lib/mac_x64/cef
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES=arm64 \
                -DPROJECT_ARCH=arm64 \
                -DUSE_SANDBOX=OFF \
                -Bbuild -H.
          cmake --build build --target libcef_dll_wrapper --config Release --parallel $(sysctl -n hw.ncpu)
          cp build/libcef_dll_wrapper/libcef_dll_wrapper.a .

      - name: Cache X-Plane SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: SDK
          key: xplane-sdk-${{ env.XPLANE_SDK_VERSION }}

      - name: Download X-Plane SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          curl -fSL -o sdk.zip "$XPLANE_SDK_URL"
          unzip -q sdk.zip -d SDK_tmp
          mv SDK_tmp/SDK .
          rm -rf SDK_tmp sdk.zip

      # ---- Build ----
      - name: Build SkyScript (macOS arm64)
        run: |
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=toolchain-mac.cmake \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DXPLANE_VERSION=12 \
            -DXPLANE_SDK_ROOT="${{ github.workspace }}/SDK" \
            -Bbuild/mac -H.
          cmake --build build/mac --parallel $(sysctl -n hw.ncpu)

      # ---- Code signing & notarization ----
      - name: Import Apple code signing cert
        if: github.event_name != 'pull_request'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Sign SkyScript.xpl (macOS)
        if: github.event_name != 'pull_request'
        run: |
          codesign --timestamp \
            --options runtime \
            --sign "${{ secrets.CODESIGN_IDENTITY }}" \
            build/mac/mac_x64/SkyScript.xpl

      - name: Notarize SkyScript.xpl (macOS)
        if: github.event_name != 'pull_request'
        run: |
          ditto -c -k --keepParent \
            build/mac/mac_x64/SkyScript.xpl \
            build/mac/SkyScript-mac.zip

          xcrun notarytool submit build/mac/SkyScript-mac.zip \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.MAC_DEV_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAMID }}" \
            --wait

      # ---- Upload artifacts ----
      - name: Upload macOS plugin
        uses: actions/upload-artifact@v4
        with:
          name: mac_x64
          path: build/mac/mac_x64/SkyScript.xpl

      - name: Upload macOS library
        uses: actions/upload-artifact@v4
        with:
          name: lib_mac_x64
          path: |
            build/mac/libSkyScriptLib.dylib
            lib/mac_x64/cef/**

  # ---------------------------------------------------------------------------
  # Linux – x86_64, built in container matching the Docker setup
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: debian:12
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y \
            build-essential cmake pkg-config zip unzip git curl \
            libgl-dev libssl-dev libcurl4-openssl-dev libudev-dev \
            python3 ca-certificates libnss3 libatk-bridge2.0-0

      - uses: actions/checkout@v4

      # ---- Dependencies ----
      - name: Cache CEF (Linux x64)
        id: cache-cef-lin
        uses: actions/cache@v4
        with:
          path: lib/lin_x64/cef
          key: cef-linux64-${{ env.CEF_CACHE_VERSION }}

      - name: Download CEF (Linux x64)
        if: steps.cache-cef-lin.outputs.cache-hit != 'true'
        run: |
          curl -fSL -o cef_lin.tar.bz2 \
            "https://cef-builds.spotifycdn.com/${CEF_VERSION}_linux64.tar.bz2"
          mkdir -p cef_lin_extract
          tar xjf cef_lin.tar.bz2 -C cef_lin_extract --strip-components=1
          mkdir -p lib/lin_x64/cef
          cp -R cef_lin_extract/include lib/lin_x64/cef/
          cp -R cef_lin_extract/Release lib/lin_x64/cef/
          cp -R cef_lin_extract/libcef_dll lib/lin_x64/cef/
          cp -R cef_lin_extract/cmake lib/lin_x64/cef/
          cp cef_lin_extract/CMakeLists.txt lib/lin_x64/cef/
          cp cef_lin_extract/LICENSE.txt lib/lin_x64/cef/
          cp cef_lin_extract/README.txt lib/lin_x64/cef/

      - name: Build CEF wrapper (Linux)
        if: steps.cache-cef-lin.outputs.cache-hit != 'true'
        run: |
          cd lib/lin_x64/cef
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DPROJECT_ARCH=x86_64 \
                -DUSE_SANDBOX=OFF \
                -Bbuild -H.
          cmake --build build --target libcef_dll_wrapper --config Release --parallel $(nproc)
          mkdir -p libcef_dll_wrapper
          cp build/libcef_dll_wrapper/libcef_dll_wrapper.a libcef_dll_wrapper/

      - name: Cache X-Plane SDK
        id: cache-sdk-lin
        uses: actions/cache@v4
        with:
          path: SDK
          key: xplane-sdk-${{ env.XPLANE_SDK_VERSION }}

      - name: Download X-Plane SDK
        if: steps.cache-sdk-lin.outputs.cache-hit != 'true'
        run: |
          curl -fSL -o sdk.zip "$XPLANE_SDK_URL"
          unzip -q sdk.zip -d SDK_tmp
          mv SDK_tmp/SDK .
          rm -rf SDK_tmp sdk.zip

      # ---- Build ----
      - name: Build SkyScript (Linux x64)
        run: |
          cmake \
            -DCMAKE_CXX_FLAGS='-march=x86-64' \
            -DCMAKE_TOOLCHAIN_FILE=toolchain-lin.cmake \
            -DXPLANE_VERSION=12 \
            -DXPLANE_SDK_ROOT="$(pwd)/SDK" \
            -Bbuild/lin -H.
          cmake --build build/lin --parallel $(nproc)

      # ---- Upload artifacts ----
      - name: Upload Linux plugin
        uses: actions/upload-artifact@v4
        with:
          name: lin_x64
          path: build/lin/lin_x64/SkyScript.xpl

      - name: Upload Linux library
        uses: actions/upload-artifact@v4
        with:
          name: lib_lin_x64
          path: |
            build/lin/libSkyScriptLib.so
            lib/lin_x64/cef/**

  # ---------------------------------------------------------------------------
  # Windows – x86_64, native MSVC
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---- Dependencies ----
      - name: Cache CEF (Windows x64)
        id: cache-cef-win
        uses: actions/cache@v4
        with:
          path: lib/win_x64/cef
          key: cef-windows64-${{ env.CEF_CACHE_VERSION }}-msvc

      - name: Download CEF (Windows x64)
        if: steps.cache-cef-win.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://cef-builds.spotifycdn.com/cef_binary_117.2.5%2Bgda4c36a%2Bchromium-117.0.5938.152_windows64.tar.bz2"
          Invoke-WebRequest -Uri $url -OutFile cef_win.tar.bz2
          mkdir cef_win_extract
          tar xjf cef_win.tar.bz2 -C cef_win_extract --strip-components=1
          New-Item -ItemType Directory -Force -Path lib/win_x64/cef
          Copy-Item -Recurse cef_win_extract/include lib/win_x64/cef/
          Copy-Item -Recurse cef_win_extract/Release lib/win_x64/cef/
          Copy-Item -Recurse cef_win_extract/libcef_dll lib/win_x64/cef/
          Copy-Item -Recurse cef_win_extract/cmake lib/win_x64/cef/
          Copy-Item cef_win_extract/CMakeLists.txt lib/win_x64/cef/
          Copy-Item cef_win_extract/LICENSE.txt lib/win_x64/cef/
          Copy-Item cef_win_extract/README.txt lib/win_x64/cef/

      - name: Build CEF wrapper (Windows/MSVC)
        run: |
          if (Test-Path "lib/win_x64/cef/libcef_dll_wrapper/libcef_dll_wrapper.lib") {
            Write-Host "CEF wrapper already present in cache."
            exit 0
          }

          cmake -S lib/win_x64/cef -B lib/win_x64/cef/build -G "Visual Studio 17 2022" -A x64 -DPROJECT_ARCH=x86_64 -DUSE_SANDBOX=OFF
          cmake --build lib/win_x64/cef/build --config Release --target libcef_dll_wrapper --parallel
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          New-Item -ItemType Directory -Force -Path lib/win_x64/cef/libcef_dll_wrapper | Out-Null
          $wrapperLib = Get-ChildItem -Path lib/win_x64/cef/build -Recurse -Filter libcef_dll_wrapper.lib | Select-Object -First 1
          if (-not $wrapperLib) {
            throw "libcef_dll_wrapper.lib not found after the CEF wrapper build"
          }
          Copy-Item $wrapperLib.FullName lib/win_x64/cef/libcef_dll_wrapper/

      - name: Cache X-Plane SDK
        id: cache-sdk-win
        uses: actions/cache@v4
        with:
          path: SDK
          key: xplane-sdk-${{ env.XPLANE_SDK_VERSION }}

      - name: Download X-Plane SDK
        if: steps.cache-sdk-win.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "$env:XPLANE_SDK_URL" -OutFile sdk.zip
          Expand-Archive -Path sdk.zip -DestinationPath SDK_tmp
          Move-Item SDK_tmp/SDK .
          Remove-Item -Recurse SDK_tmp, sdk.zip

      # ---- Build ----
      - name: Install curl via vcpkg (Windows)
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not set on the runner"
          }
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install curl:x64-windows-static
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build SkyScript (Windows x64)
        run: |
          cmake -S . -B build/win -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DXPLANE_VERSION=12 -DXPLANE_SDK_ROOT="$env:GITHUB_WORKSPACE\SDK"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          cmake --build build/win --config Release --parallel
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          New-Item -ItemType Directory -Force -Path build/windows-artifact | Out-Null
          $plugin = Get-ChildItem -Path build/win -Recurse -Filter SkyScript.xpl | Select-Object -First 1
          if (-not $plugin) {
            throw "SkyScript.xpl not found after the Windows build"
          }
          Copy-Item $plugin.FullName build/windows-artifact/SkyScript.xpl

          $lib = Get-ChildItem -Path build/win -Filter SkyScriptLib.lib | Select-Object -First 1
          if (-not $lib) {
            $lib = Get-ChildItem -Path build/win -Recurse -Filter SkyScriptLib.lib | Select-Object -First 1
          }
          if ($lib) {
            Copy-Item $lib.FullName build/windows-artifact/SkyScriptLib.lib
          } else {
            Write-Warning "SkyScriptLib.lib not found"
          }

          $dll = Get-ChildItem -Path build/win -Recurse -Filter SkyScriptLib.dll | Select-Object -First 1
          if (-not $dll) {
            throw "SkyScriptLib.dll not found after the Windows build"
          }
          Copy-Item $dll.FullName build/windows-artifact/SkyScriptLib.dll

      # ---- Upload artifacts ----
      - name: Upload Windows plugin
        uses: actions/upload-artifact@v4
        with:
          name: win_x64
          path: build/windows-artifact/SkyScript.xpl

      - name: Upload Windows library
        uses: actions/upload-artifact@v4
        with:
          name: lib_win_x64
          path: |
            build/windows-artifact/SkyScriptLib.dll
            build/windows-artifact/SkyScriptLib.lib
            lib/win_x64/cef/**

  # ---------------------------------------------------------------------------
  # Package + Release (runs after all builds complete)
  # ---------------------------------------------------------------------------
  release:
    needs: [build-mac, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build apps
        run: |
          for app_dir in apps/*/; do
            if [ -f "${app_dir}package.json" ]; then
              app_name=$(basename "$app_dir")
              echo "Building app: $app_name"
              (cd "$app_dir" && npm ci && npm run build)
            fi
          done

      - name: Determine version from git tag
        id: version
        run: |
          TAG=${GITHUB_REF##*/}
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create distribution bundles
        run: |
          PRODUCT_NAME="SkyScript"
          VERSION="${{ steps.version.outputs.version }}"

          # ---- Library distribution (shared libs + C API header) ----
          LIB_DIST="dist/${PRODUCT_NAME}-lib"
          mkdir -p "$LIB_DIST/include"

          cp src/skyscript_c.h "$LIB_DIST/include/"
          cp LICENSE "$LIB_DIST/"

          mkdir -p "$LIB_DIST/lib/mac_x64" "$LIB_DIST/lib/lin_x64" "$LIB_DIST/lib/win_x64"
          cp artifacts/lib_mac_x64/libSkyScriptLib.dylib "$LIB_DIST/lib/mac_x64/"
          cp -R artifacts/lib_mac_x64/lib/mac_x64/cef "$LIB_DIST/lib/mac_x64/"
          cp artifacts/lib_lin_x64/libSkyScriptLib.so "$LIB_DIST/lib/lin_x64/"
          cp -R artifacts/lib_lin_x64/lib/lin_x64/cef "$LIB_DIST/lib/lin_x64/"
          cp artifacts/lib_win_x64/SkyScriptLib.dll "$LIB_DIST/lib/win_x64/"
          cp artifacts/lib_win_x64/SkyScriptLib.lib "$LIB_DIST/lib/win_x64/"
          cp -R artifacts/lib_win_x64/lib/win_x64/cef "$LIB_DIST/lib/win_x64/"

          # Copy Go bindings
          cp go.mod "$LIB_DIST/"
          cp -r go "$LIB_DIST/"

          # ---- Example plugin distribution ----
          EXAMPLE_DIST="dist/${PRODUCT_NAME}-example"
          mkdir -p "$EXAMPLE_DIST/mac_x64" "$EXAMPLE_DIST/lin_x64" "$EXAMPLE_DIST/win_x64"

          # Include example source code and apps
          mkdir -p "$EXAMPLE_DIST/example"
          cp example/main.cpp "$EXAMPLE_DIST/example/"
          cp -r apps "$EXAMPLE_DIST/example/"

          # Include library headers and shared libs
          cp -r "$LIB_DIST/include" "$EXAMPLE_DIST/"
          cp -r "$LIB_DIST/lib" "$EXAMPLE_DIST/"

          cp artifacts/mac_x64/SkyScript.xpl "$EXAMPLE_DIST/mac_x64/"
          cp artifacts/lin_x64/SkyScript.xpl "$EXAMPLE_DIST/lin_x64/"
          cp artifacts/win_x64/SkyScript.xpl "$EXAMPLE_DIST/win_x64/"

          cp -r assets "$EXAMPLE_DIST/"

          # Bundle built apps into example
          if [ -d "apps" ]; then
            mkdir -p "$EXAMPLE_DIST/apps"
            for app_dir in apps/*/; do
              app_name=$(basename "$app_dir")
              if [ -d "${app_dir}build" ]; then
                cp -r "${app_dir}build" "$EXAMPLE_DIST/apps/${app_name}"
                if [ -f "${app_dir}manifest.yaml" ]; then
                  cp "${app_dir}manifest.yaml" "$EXAMPLE_DIST/apps/${app_name}/"
                fi
                echo "Bundled app: $app_name"
              elif [ -f "${app_dir}manifest.yaml" ]; then
                mkdir -p "$EXAMPLE_DIST/apps/${app_name}"
                cp "${app_dir}manifest.yaml" "$EXAMPLE_DIST/apps/${app_name}/"
                echo "Bundled app (manifest only): $app_name"
              fi
            done
          fi

          printf 'module|https://github.com/x-z7a/skyscript\nname|SkyScript\nversion|%s\nlocked|false\ndisabled|false\nzone|custom\n' "$VERSION" \
            > "$EXAMPLE_DIST/skunkcrafts_updater.cfg"

          # ---- Create zip archives ----
          cd dist
          zip -rq "${PRODUCT_NAME}-lib-${VERSION}-XP12.zip" "${PRODUCT_NAME}-lib" \
            -x "*/.DS_Store" -x "*/__MACOSX/*"
          zip -rq "${PRODUCT_NAME}-example-${VERSION}-XP12.zip" "${PRODUCT_NAME}-example" \
            -x "*/.DS_Store" -x "*/__MACOSX/*"

      - name: Generate release notes
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          TAG=${{ steps.version.outputs.tag }}

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          {
            echo 'notes<<RELEASE_NOTES_EOF'

            echo "## What's Changed"
            echo ""

            # Features
            FEATS=$(git log "$RANGE" --pretty=format:"%s" --no-merges | grep -iE '^feat(\(.*\))?!?:' || true)
            if [ -n "$FEATS" ]; then
              echo "### Features"
              echo "$FEATS" | sed 's/^feat\(([^)]*)\)\?!*: //' | while IFS= read -r line; do
                echo "- $line"
              done
              echo ""
            fi

            # Bug Fixes
            FIXES=$(git log "$RANGE" --pretty=format:"%s" --no-merges | grep -iE '^fix(\(.*\))?!?:' || true)
            if [ -n "$FIXES" ]; then
              echo "### Bug Fixes"
              echo "$FIXES" | sed 's/^fix\(([^)]*)\)\?!*: //' | while IFS= read -r line; do
                echo "- $line"
              done
              echo ""
            fi

            # Performance
            PERFS=$(git log "$RANGE" --pretty=format:"%s" --no-merges | grep -iE '^perf(\(.*\))?!?:' || true)
            if [ -n "$PERFS" ]; then
              echo "### Performance"
              echo "$PERFS" | sed 's/^perf\(([^)]*)\)\?!*: //' | while IFS= read -r line; do
                echo "- $line"
              done
              echo ""
            fi

            # Refactoring
            REFACTORS=$(git log "$RANGE" --pretty=format:"%s" --no-merges | grep -iE '^refactor(\(.*\))?!?:' || true)
            if [ -n "$REFACTORS" ]; then
              echo "### Refactoring"
              echo "$REFACTORS" | sed 's/^refactor\(([^)]*)\)\?!*: //' | while IFS= read -r line; do
                echo "- $line"
              done
              echo ""
            fi

            # Other changes (chore, docs, style, test, build, ci, etc.)
            OTHERS=$(git log "$RANGE" --pretty=format:"%s" --no-merges | grep -ivE '^(feat|fix|perf|refactor)(\(.*\))?!?:' || true)
            if [ -n "$OTHERS" ]; then
              echo "### Other Changes"
              echo "$OTHERS" | while IFS= read -r line; do
                echo "- $line"
              done
              echo ""
            fi

            # Breaking changes (indicated by ! before the colon)
            BREAKING=$(git log "$RANGE" --pretty=format:"%s" --no-merges | grep -E '^[a-z]+(\(.*\))?!:' || true)
            if [ -n "$BREAKING" ]; then
              echo "### Breaking Changes"
              echo "$BREAKING" | while IFS= read -r line; do
                echo "- $line"
              done
              echo ""
            fi

            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG:-$(git rev-list --max-parents=0 HEAD | head -1)}...$TAG"

            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            dist/SkyScript-lib-${{ steps.version.outputs.version }}-XP12.zip
            dist/SkyScript-example-${{ steps.version.outputs.version }}-XP12.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
